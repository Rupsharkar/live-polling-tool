services:
  - type: web
    name: live-polling-backend
    env: go
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: livepoll
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 8080
